name: Playwright Tests
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      ENV: dev
      APP_BASE_URL: http://localhost:4200
      API_BASE_URL: http://localhost:8091
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Enable ARM images for Docker
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Start Toolshop and prepare database
        run: |
          git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git "$RUNNER_TEMP/toolshop"
          cd "$RUNNER_TEMP/toolshop"
          docker compose -f docker-compose.prod.yml up --pull missing -d mariadb laravel-api web angular-ui
          timeout 90 bash -c 'until docker compose -f docker-compose.prod.yml exec -T mariadb mysqladmin ping -h 127.0.0.1 --silent >/dev/null 2>&1; do sleep 2; done'
          docker compose -f docker-compose.prod.yml exec -T -u root laravel-api sh -c 'touch storage/logs/laravel.log && chown www-data storage/logs/laravel.log && chmod u+w storage/logs/laravel.log'
          docker compose -f docker-compose.prod.yml exec -T laravel-api php artisan migrate --seed --force
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 http://localhost:8091/products -o /dev/null
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 http://localhost:4200/ -o /dev/null
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
